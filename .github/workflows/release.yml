name: Build release artifacts

# Builds the deployable backend WAR and frontend bundle whenever the
# nairobi-convention branch changes, or on demand. Produces versioned,
# downloadable artifacts for the separate (manual-approval) deploy workflow.
# This workflow does NOT touch the live server.

on:
  push:
    branches: [ "nairobi-convention" ]
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build WAR
        working-directory: ./symphony-ws
        run: mvn -B package --file pom.xml -Pskip-apitests

      - name: Record build metadata
        run: |
          echo "commit=${GITHUB_SHA}" > build-info.txt
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: symphony-ws-war
          path: |
            symphony-ws/target/*.war
            build-info.txt
          retention-days: 90

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - name: Install and build
        working-directory: ./frontend
        run: |
          npm ci
          npx ng build --configuration production

      - uses: actions/upload-artifact@v4
        with:
          name: symphony-fe-dist
          path: frontend/dist/symphony-fe
          retention-days: 90
